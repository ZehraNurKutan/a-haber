<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Haber — Yükleniyor</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f5;
      color: #1a1a1a;
      line-height: 1.6;
    }
    .wrap {
      max-width: 820px;
      margin: 0 auto;
      padding: 20px 16px 48px;
    }
    .back {
      display: inline-block;
      margin-bottom: 16px;
      color: #cc0000;
      font-weight: 700;
      text-decoration: none;
    }
    .back:hover { text-decoration: underline; }
    .card {
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }
    .card img {
      width: 100%;
      max-height: 420px;
      object-fit: cover;
      display: block;
      background: #e8e8e8;
    }
    .card-body { padding: 24px 20px; }
    .meta {
      font-size: 13px;
      color: #6b7280;
      margin-bottom: 12px;
    }
    .meta strong { color: #cc0000; }
    h1 {
      margin: 0 0 16px;
      font-size: clamp(22px, 4vw, 32px);
      line-height: 1.25;
    }
    .content {
      font-size: 17px;
    }
    .content p { margin: 0 0 1em; }
    .content img { max-width: 100%; height: auto; }
    .err {
      padding: 24px;
      text-align: center;
      color: #b91c1c;
    }
    .loading { padding: 48px; text-align: center; color: #6b7280; }
  </style>
</head>
<body>
  <div class="wrap">
    <a href="/index.html" class="back">← Ana sayfa</a>
    <article class="card" id="haber-kart">
      <div class="loading" id="durum">Haber yükleniyor…</div>
    </article>
  </div>
  <script src="/js/haber-detay.js" defer></script>
</body>
</html>
